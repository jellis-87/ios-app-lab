# The live-session driver: a UI test that runs for the whole session,
# launches the app under test and accepts taps over HTTP.
name: LiveDriver
options:
  bundleIdPrefix: io.github.jellis-87.livedriver
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  LiveDriverHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jellis-87.livedriver.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  LiveDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LiveDriverHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jellis-87.livedriver.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiveDriver:
    build:
      targets:
        LiveDriverHost: all
        LiveDriverUITests: [test]
    test:
      targets: [LiveDriverUITests]
